# App iPhone de NoteFlow : le site dans une vue web, plus la localisation en arrière-plan et l'activité en direct
# (écran verrouillé, Dynamic Island). Projet Xcode généré par XcodeGen sur GitHub Actions (.github/workflows/ios.yml),
# compilé sans signature : SideStore signe l'app avec l'identifiant Apple de l'élève à l'installation.
name: NoteFlow
options:
  bundleIdPrefix: com.noteflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NoteFlow:
    type: application
    platform: iOS
    sources:
      - NoteFlow
      - Shared
    dependencies:
      - target: NoteFlowLive
        embed: true
    info:
      path: NoteFlow/Info.plist
      properties:
        CFBundleDisplayName: NoteFlow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "NoteFlow suit ton trajet pour te guider jusqu’à l’arrêt et au collège."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Avec « Toujours », l’activité en direct de ton écran verrouillé suit ton trajet même quand NoteFlow est fermé."
        NSCameraUsageDescription: "Pour photographier tes cours, tes feuilles et tes sujets."
        NSPhotoLibraryUsageDescription: "Pour choisir les photos de tes cours."
        NSMicrophoneUsageDescription: "Pour la dictée à voix haute."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noteflow.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NoteFlowLive:
    type: app-extension
    platform: iOS
    sources:
      - Live
      - Shared
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: NoteFlow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noteflow.app.live
